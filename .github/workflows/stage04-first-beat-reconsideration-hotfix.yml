name: Stage04 first-beat temporal reconsideration hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage04-first-beat-reconsideration-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture baseline runtime hash
        shell: bash
        run: echo "BASE_RUNTIME_SHA=$(sha256sum app/stage04_v238_runtime.py | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Prepare patch driver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_stage04_first_beat_temporal_reconsideration_fix.py')
          text = path.read_text(encoding='utf-8')

          old = '''    old = (
                  '            "static_outcome=证据只支持已经成立的状态/结果/关系而未描述发生过程；"\\n'
              )
              new = (
                  '            "static_outcome=证据只支持已经成立的状态/结果/关系，或只支持一个正在持续但没有证据支持内部前中后里程碑的稳定活动状态；"\\n'
              )
              text = replace_once(text, old, new, "classification repair semantics")
          '''
          new = '''    old = '"static_outcome=证据只支持已经成立的状态/结果/关系而未描述发生过程；"'
              new = '"static_outcome=证据只支持已经成立的状态/结果/关系，或只支持一个正在持续但没有证据支持内部前中后里程碑的稳定活动状态；"'
              text = replace_once(text, old, new, "classification repair semantics")
          '''
          if old not in text:
              raise SystemExit('classification repair driver marker missing')
          text = text.replace(old, new, 1)

          old = '    if previous_beat is None and current_rows:\\n'
          new = '    if target_order == 1 and previous_beat is None and current_rows:\\n'
          if text.count(old) != 1:
              raise SystemExit(f'first-beat guard marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply first-beat temporal reconsideration fix
        run: python tools/apply_stage04_first_beat_temporal_reconsideration_fix.py

      - name: Refresh intentional runtime hash assertions
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          runtime = Path('app/stage04_v238_runtime.py')
          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          old = os.environ['BASE_RUNTIME_SHA']
          for path in [
              Path('tests/test_stage02_performance_optimization.py'),
              Path('tests/test_stage04_frontend_entry.py'),
          ]:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected baseline runtime hash not found in {path}')
              path.write_text(text.replace(old, digest), encoding='utf-8')
          print(f'RUNTIME_SHA256={digest}')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/stage04_v238_runtime.py tests/test_stage04_first_beat_temporal_reconsideration.py
          python -m unittest tests.test_stage04_first_beat_temporal_reconsideration -v
          python -m unittest tests.test_stage04_observable_state_repair -v
          python -m unittest tests.test_stage04_regroup_recovery -v
          python -m unittest tests.test_stage04_audit_repair_routing -v
          python -m unittest discover -s tests -p 'test_stage04_temporal_mode*.py' -v
          python -m unittest tests.test_stage04_static_regroup_repair -v
          git diff --check

      - name: Full test suite
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNTIME_SHA256=$(sha256sum app/stage04_v238_runtime.py | awk '{print $1}')"
          git config user.name "ChatGPT Stage04 Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app/stage04_v238_runtime.py \
            tests/test_stage04_first_beat_temporal_reconsideration.py \
            tests/test_stage02_performance_optimization.py \
            tests/test_stage04_frontend_entry.py
          git rm .github/workflows/stage04-first-beat-reconsideration-hotfix.yml
          git rm -f tools/apply_stage04_first_beat_temporal_reconsideration_fix.py
          git commit -m "fix(stage04): recover first beat without future evidence"
          git push origin HEAD:main
