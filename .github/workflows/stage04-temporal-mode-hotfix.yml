name: Stage04 temporal-mode hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage04-temporal-mode-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d9d5bea8cf941b8797aae9eea9c5731a0041eee9"

      - name: Apply deterministic Stage04 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('app/stage04_v238_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''_TEMPORAL_MODES = {
              "observable_transition",
              "static_outcome",
              "insufficient_visual_evidence",
          }

          _STATIC_PRESENTATION_FIELDS = (''',
              '''_TEMPORAL_MODES = {
              "observable_transition",
              "static_outcome",
              "insufficient_visual_evidence",
          }

          _TEMPORAL_MODE_CONTRACT_MARKER = (
              "<enum:observable_transition|static_outcome|insufficient_visual_evidence>"
          )

          _STATIC_PRESENTATION_FIELDS = (''',
              'temporal enum marker',
          )

          replace_once(
              '''    if key in {"source_evidence_ids", "evidence_ids", "source_ids"}:
                  return "<allowed_evidence_id>"''',
              '''    if key == "temporal_mode":
                  return _TEMPORAL_MODE_CONTRACT_MARKER
              if key in {"source_evidence_ids", "evidence_ids", "source_ids"}:
                  return "<allowed_evidence_id>"''',
              'visible temporal enum contract',
          )

          replace_once(
              '''        + "<...> 是类型/作用域占位符，不是可复制的字面值。"
                  + "所有 evidence ID、Beat order 和数值必须来自当前任务上下文或当前专用规划步骤，"''',
              '''        + "<...> 是类型/作用域占位符，不是可复制的字面值。"
                  + "其中 <enum:a|b> 表示该字段只能精确返回列出的枚举值之一，禁止自造同义标签。"
                  + "所有 evidence ID、Beat order 和数值必须来自当前任务上下文或当前专用规划步骤，"''',
              'strict enum explanation',
          )

          helper = r'''
          async def _repair_invalid_temporal_mode_classification(
              env: dict[str, Any],
              *,
              row: dict[str, Any],
              compact_beats: list[dict[str, Any]],
              anchors: list[dict[str, Any]],
              context: str,
          ) -> dict[str, Any]:
              """Repair only an out-of-contract temporal_mode classification.

              This is deliberately not an alias mapper.  The replacement mode must be
              re-classified by Qwen from the already locked Beat/evidence scope.  No
              narrative, evidence, entity, timing or presentation field is writable.
              """
              item = copy.deepcopy(row)
              raw_mode = str(item.get("temporal_mode") or "").strip().lower()
              if not raw_mode or raw_mode in _TEMPORAL_MODES:
                  return item

              evidence_ids = _id_list(item.get("source_evidence_ids"))
              covered_orders = _orders(item.get("covered_beat_orders"))
              anchor_map = {
                  str(anchor.get("id") or ""): anchor
                  for anchor in anchors or []
                  if isinstance(anchor, dict) and str(anchor.get("id") or "")
              }
              beat_map = {
                  int(beat.get("order") or 0): beat
                  for beat in compact_beats or []
                  if isinstance(beat, dict) and int(beat.get("order") or 0) > 0
              }
              exact_evidence = [
                  copy.deepcopy(anchor_map[evidence_id])
                  for evidence_id in evidence_ids
                  if evidence_id in anchor_map
              ]
              locked_beats = [
                  copy.deepcopy(beat_map[order])
                  for order in covered_orders
                  if order in beat_map
              ]

              def failure_metadata(
                  *,
                  output: dict[str, Any] | None = None,
                  reason: str = "",
                  progress: str,
                  post: dict[str, Any] | None = None,
              ) -> dict[str, Any]:
                  input_payload = {
                      "raw_temporal_mode": raw_mode,
                      "allowed_temporal_modes": sorted(_TEMPORAL_MODES),
                      "covered_beat_orders": covered_orders,
                      "source_evidence_ids": evidence_ids,
                      "locked_beats": locked_beats,
                      "exact_selected_evidence": exact_evidence,
                      "candidate_semantic_core": _candidate_semantic_core(item),
                  }
                  output_payload = copy.deepcopy(output or {})
                  input_fingerprint = hashlib.sha256(
                      json.dumps(
                          input_payload,
                          ensure_ascii=False,
                          sort_keys=True,
                          default=str,
                      ).encode("utf-8")
                  ).hexdigest()
                  output_fingerprint = hashlib.sha256(
                      json.dumps(
                          output_payload,
                          ensure_ascii=False,
                          sort_keys=True,
                          default=str,
                      ).encode("utf-8")
                  ).hexdigest()
                  return {
                      "raw_temporal_mode": raw_mode,
                      "allowed_temporal_modes": sorted(_TEMPORAL_MODES),
                      "temporal_mode_repair_input": input_payload,
                      "temporal_mode_repair_output": output_payload,
                      "temporal_mode_repair_reason": reason,
                      "temporal_mode_evidence_ids": _id_list(
                          output_payload.get("temporal_mode_evidence_ids")
                      ),
                      "pre_repair_candidate": copy.deepcopy(item),
                      "post_repair_candidate": copy.deepcopy(post),
                      "repair_input_fingerprint": input_fingerprint,
                      "repair_output_fingerprint": output_fingerprint,
                      "repair_progress": progress,
                      "failed_rule": "temporal_mode_contract",
                      "failed_rules": ["temporal_mode_contract"],
                      "evidence_sufficiency": "temporal_mode_contract_invalid",
                      "repair_context": context,
                  }

              if (
                  not evidence_ids
                  or len(exact_evidence) != len(evidence_ids)
                  or not covered_orders
                  or len(locked_beats) != len(covered_orders)
              ):
                  raise Stage04ShotRepairError(
                      f"{context}: 非法 temporal_mode 且无法完整锁定 Beat/evidence 进行字段级重分类",
                      metadata=failure_metadata(
                          progress="rejected_temporal_mode_repair_scope_incomplete",
                      ),
                  )

              system_prompt = (
                  "你是 strict-shot-v2 temporal_mode 字段级重分类器。"
                  "当前 Shot 的 Beat、source evidence、人物/道具绑定和全部叙事/表现字段已经锁定。"
                  "只能根据 EXACT_SELECTED_EVIDENCE 重新判断 temporal_mode，绝对不能改写 Shot。"
                  "temporal_mode 只能精确返回 observable_transition、static_outcome、"
                  "insufficient_visual_evidence 三者之一："
                  "observable_transition=证据明确支持可观察的前/中/后状态变化；"
                  "static_outcome=证据只支持已经成立的状态/结果/关系而未描述发生过程；"
                  "insufficient_visual_evidence=不新增剧情事实就无法形成证据支持的视觉状态。"
                  "必须返回 evidence-based reason 和 temporal_mode_evidence_ids；"
                  "evidence ids 只能从当前 Shot 已锁定 source_evidence_ids 中选择。"
                  "RAW_INVALID_TEMPORAL_MODE 仅用于诊断，不是候选枚举，禁止照抄。"
                  "不得依据题材关键词或固定业务类别。只返回严格 JSON。"
              )
              prompt = (
                  "=== RAW_INVALID_TEMPORAL_MODE ===\n"
                  + raw_mode
                  + "\n\n=== LOCKED_COVERED_BEATS ===\n"
                  + json.dumps(locked_beats, ensure_ascii=False, separators=(",", ":"))
                  + "\n\n=== EXACT_SELECTED_EVIDENCE ===\n"
                  + json.dumps(exact_evidence, ensure_ascii=False, separators=(",", ":"))
                  + "\n\n=== LOCKED_CANDIDATE_SEMANTIC_CORE ===\n"
                  + json.dumps(
                      {
                          **_candidate_semantic_core(item),
                          "source_fact": str(item.get("source_fact") or "")[:700],
                          "narrative_start_state": str(item.get("narrative_start_state") or "")[:900],
                          "narrative_state": str(item.get("narrative_state") or "")[:900],
                          "narrative_end_state": str(item.get("narrative_end_state") or "")[:900],
                          "visual_realization": str(item.get("visual_realization") or "")[:900],
                          "visual_start_frame": str(item.get("visual_start_frame") or "")[:900],
                          "representative_frame": str(item.get("representative_frame") or "")[:900],
                          "visual_end_frame": str(item.get("visual_end_frame") or "")[:900],
                          "visual_motion": str(item.get("visual_motion") or "")[:900],
                          "character_entity_ids": _id_list(item.get("character_entity_ids")),
                          "prop_entity_ids": _id_list(item.get("prop_entity_ids")),
                      },
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              )
              contract = json.dumps(
                  {
                      "temporal_mode": "observable_transition",
                      "temporal_mode_reason": "",
                      "temporal_mode_evidence_ids": [evidence_ids[0]],
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              )

              try:
                  raw, parsed, _ = await _qwen(
                      env,
                      phase="studio_stage04_temporal_mode_classification_repair_qwen32b",
                      system_prompt=system_prompt,
                      prompt=prompt,
                      contract=contract,
                      max_tokens=420,
                      temperature=0.0,
                  )
              except Exception as exc:
                  raise Stage04ShotRepairError(
                      f"{context}: temporal_mode 字段级重分类调用失败：{exc}",
                      metadata=failure_metadata(
                          reason=str(exc),
                          progress="temporal_mode_repair_call_failed",
                      ),
                  ) from exc

              obj = _parse_object(env, raw, parsed)
              repaired_mode = str(obj.get("temporal_mode") or "").strip().lower()
              reason = str(obj.get("temporal_mode_reason") or "").strip()
              repaired_evidence_ids = _id_list(obj.get("temporal_mode_evidence_ids"))
              repair_output = {
                  "temporal_mode": repaired_mode,
                  "temporal_mode_reason": reason,
                  "temporal_mode_evidence_ids": repaired_evidence_ids,
              }

              valid_output = (
                  repaired_mode in _TEMPORAL_MODES
                  and bool(reason)
                  and bool(repaired_evidence_ids)
                  and set(repaired_evidence_ids).issubset(set(evidence_ids))
              )
              if not valid_output:
                  progress = (
                      "rejected_no_progress"
                      if repaired_mode == raw_mode
                      else "rejected_invalid_temporal_mode_repair_output"
                  )
                  raise Stage04ShotRepairError(
                      f"{context}: temporal_mode 字段级重分类仍未形成闭合枚举；"
                      f"raw={raw_mode!r} repaired={repaired_mode!r}",
                      metadata=failure_metadata(
                          output=repair_output,
                          reason=reason,
                          progress=progress,
                      ),
                  )

              repaired = copy.deepcopy(item)
              repaired["temporal_mode"] = repaired_mode
              repaired["temporal_mode_reason"] = reason
              repaired["temporal_mode_evidence_ids"] = repaired_evidence_ids
              diagnostics = failure_metadata(
                  output=repair_output,
                  reason=reason,
                  progress="temporal_mode_reclassified",
                  post=repaired,
              )
              diagnostics["failed_rule"] = ""
              diagnostics["failed_rules"] = []
              diagnostics["evidence_sufficiency"] = "classified"
              repaired["_temporal_mode_repair_diagnostics"] = diagnostics
              return repaired


          '''

          marker = 'async def _complete_targeted_shot_structure(\n'
          if text.count(marker) != 1:
              raise SystemExit(f'temporal repair helper insertion: expected one marker, got {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '''    item[
                  "evidence_binding_source"
              ] = evidence_source

              item = _normalize_temporal_contract(
                  item,
                  evidence_ids=evidence_ids,
                  raw_index=1,
              )''',
              '''    item[
                  "evidence_binding_source"
              ] = evidence_source

              item = await _repair_invalid_temporal_mode_classification(
                  env,
                  row=item,
                  compact_beats=[beat],
                  anchors=allowed_anchor_rows,
                  context=f"Beat {target_order} targeted Shot",
              )

              item = _normalize_temporal_contract(
                  item,
                  evidence_ids=evidence_ids,
                  raw_index=1,
              )''',
              'targeted temporal repair hook',
          )

          replace_once(
              '''                                "必须返回至少一个 Shot 和合法 source_evidence_ids。"
                              )''',
              '''                                "必须返回至少一个 Shot 和合法 source_evidence_ids；"
                                  "temporal_mode 只能是 observable_transition、static_outcome、"
                                  "insufficient_visual_evidence 三者之一。"
                              )''',
              'targeted retry enum reminder',
          )

          runtime_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_stage04_temporal_mode_enum_closure.py')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists')
          test_path.write_text(r'''from __future__ import annotations

import copy
import unittest
from unittest import mock

from app import stage04_v238_runtime as runtime


def _anchor(text: str = "门缓缓打开，他走了进去。") -> dict:
    return {
        "id": "E001",
        "text": text,
        "source_start": 0,
        "source_end": len(text),
    }


def _beat(text: str = "门缓缓打开，他走了进去。") -> dict:
    return {
        "order": 1,
        "summary": text,
        "state_change": text,
        "allowed_source_evidence_ids": ["E001"],
        "source_evidence_ids": ["E001"],
    }


def _dynamic_candidate(mode: str = "initial") -> dict:
    text = "门缓缓打开，他走了进去。"
    return {
        "title": "进入",
        "duration_seconds": 3,
        "summary": text,
        "action": text,
        "temporal_mode": mode,
        "temporal_mode_reason": "model emitted an out-of-contract label",
        "temporal_mode_evidence_ids": ["E001"],
        "source_fact": text,
        "video_start_state": "门仍在开启，人物站在门外。",
        "representative_state": "门已经打开，人物正跨过门槛。",
        "video_end_state": "人物已经进入门内。",
        "covered_beat_orders": [1],
        "source_evidence_ids": ["E001"],
        "character_entity_ids": [],
        "prop_entity_ids": [],
    }


def _static_candidate(mode: str = "initial") -> dict:
    text = "众人认可了他的决定。"
    return {
        "title": "认可",
        "duration_seconds": 3,
        "summary": text,
        "action": "",
        "temporal_mode": mode,
        "temporal_mode_reason": "model emitted an out-of-contract label",
        "temporal_mode_evidence_ids": ["E001"],
        "source_fact": text,
        "narrative_start_state": text,
        "narrative_state": text,
        "narrative_end_state": text,
        "visual_realization": "稳定结果的中景构图，剧情事实保持不变。",
        "realization_scope": "presentation_only",
        "realization_assumptions": ["使用中景和轻微镜头运动呈现已成立状态"],
        "visual_start_frame": "中景固定构图，既成状态保持。",
        "representative_frame": "中景轻微推近，既成状态保持。",
        "visual_end_frame": "较紧中景停住，既成状态保持。",
        "visual_motion": "镜头轻微推近后停住。",
        "covered_beat_orders": [1],
        "source_evidence_ids": ["E001"],
        "character_entity_ids": [],
        "prop_entity_ids": [],
    }


class TemporalModeEnumContractTests(unittest.TestCase):
    def test_visible_contract_exposes_closed_temporal_enum(self) -> None:
        visible = runtime._visible_output_contract(runtime._shot_generation_contract(1))
        self.assertIn(
            "<enum:observable_transition|static_outcome|insufficient_visual_evidence>",
            visible,
        )

    def test_validator_still_rejects_unknown_mode_without_alias_mapping(self) -> None:
        row = _dynamic_candidate("initial")
        with self.assertRaisesRegex(RuntimeError, "temporal_mode 非法"):
            runtime._normalize_temporal_contract(
                row,
                evidence_ids=["E001"],
                raw_index=1,
            )


class TemporalModeFieldRepairTests(unittest.IsolatedAsyncioTestCase):
    async def test_invalid_mode_repairs_to_observable_without_mutating_locked_fields(self) -> None:
        row = _dynamic_candidate()
        before = copy.deepcopy(row)
        qwen = mock.AsyncMock(return_value=(
            {},
            {
                "temporal_mode": "observable_transition",
                "temporal_mode_reason": "evidence explicitly contains an opening-to-entry transition",
                "temporal_mode_evidence_ids": ["E001"],
            },
            {},
        ))
        with mock.patch.object(runtime, "_qwen", qwen):
            repaired = await runtime._repair_invalid_temporal_mode_classification(
                {},
                row=row,
                compact_beats=[_beat()],
                anchors=[_anchor()],
                context="test-dynamic",
            )
        self.assertEqual(repaired["temporal_mode"], "observable_transition")
        self.assertEqual(qwen.await_count, 1)
        for key, value in before.items():
            if key not in {
                "temporal_mode",
                "temporal_mode_reason",
                "temporal_mode_evidence_ids",
            }:
                self.assertEqual(repaired[key], value, key)
        normalized = runtime._normalize_temporal_contract(
            repaired,
            evidence_ids=["E001"],
            raw_index=1,
        )
        self.assertEqual(normalized["temporal_mode"], "observable_transition")

    async def test_invalid_mode_repairs_to_static_outcome_from_evidence(self) -> None:
        text = "众人认可了他的决定。"
        row = _static_candidate()
        qwen = mock.AsyncMock(return_value=(
            {},
            {
                "temporal_mode": "static_outcome",
                "temporal_mode_reason": "evidence states an established result without its transition process",
                "temporal_mode_evidence_ids": ["E001"],
            },
            {},
        ))
        with mock.patch.object(runtime, "_qwen", qwen):
            repaired = await runtime._repair_invalid_temporal_mode_classification(
                {},
                row=row,
                compact_beats=[_beat(text)],
                anchors=[_anchor(text)],
                context="test-static",
            )
        normalized = runtime._normalize_temporal_contract(
            repaired,
            evidence_ids=["E001"],
            raw_index=1,
        )
        self.assertEqual(normalized["temporal_mode"], "static_outcome")
        self.assertEqual(normalized["narrative_state"], text)

    async def test_repair_can_route_to_insufficient_visual_evidence(self) -> None:
        text = "某种无法被当前证据视觉化的状态。"
        row = _dynamic_candidate()
        row["summary"] = text
        row["source_fact"] = text
        qwen = mock.AsyncMock(return_value=(
            {},
            {
                "temporal_mode": "insufficient_visual_evidence",
                "temporal_mode_reason": "selected evidence does not support a grounded visual state",
                "temporal_mode_evidence_ids": ["E001"],
            },
            {},
        ))
        with mock.patch.object(runtime, "_qwen", qwen):
            repaired = await runtime._repair_invalid_temporal_mode_classification(
                {},
                row=row,
                compact_beats=[_beat(text)],
                anchors=[_anchor(text)],
                context="test-insufficient",
            )
        with self.assertRaises(runtime.Stage04ShotRepairError) as captured:
            runtime._normalize_temporal_contract(
                repaired,
                evidence_ids=["E001"],
                raw_index=1,
            )
        self.assertEqual(
            captured.exception.metadata["evidence_sufficiency"],
            "insufficient_visual_evidence",
        )

    async def test_same_invalid_mode_stops_after_one_field_repair(self) -> None:
        row = _dynamic_candidate()
        qwen = mock.AsyncMock(return_value=(
            {},
            {
                "temporal_mode": "initial",
                "temporal_mode_reason": "unchanged invalid classifier output",
                "temporal_mode_evidence_ids": ["E001"],
            },
            {},
        ))
        with mock.patch.object(runtime, "_qwen", qwen):
            with self.assertRaises(runtime.Stage04ShotRepairError) as captured:
                await runtime._repair_invalid_temporal_mode_classification(
                    {},
                    row=row,
                    compact_beats=[_beat()],
                    anchors=[_anchor()],
                    context="test-no-progress",
                )
        self.assertEqual(qwen.await_count, 1)
        self.assertEqual(captured.exception.metadata["raw_temporal_mode"], "initial")
        self.assertEqual(captured.exception.metadata["repair_progress"], "rejected_no_progress")
        self.assertEqual(captured.exception.metadata["failed_rule"], "temporal_mode_contract")

    async def test_real_missing_beat_path_does_not_full_retry_after_no_progress(self) -> None:
        generation = {"shots": [_dynamic_candidate()]}
        invalid_repair = {
            "temporal_mode": "initial",
            "temporal_mode_reason": "unchanged invalid classifier output",
            "temporal_mode_evidence_ids": ["E001"],
        }
        qwen = mock.AsyncMock(side_effect=[
            ({}, generation, {}),
            ({}, invalid_repair, {}),
        ])
        with mock.patch.object(runtime, "_qwen", qwen):
            with self.assertRaises(runtime.Stage04ShotRepairError) as captured:
                await runtime._generate_missing_beat_shots(
                    {},
                    missing_orders=[1],
                    compact_beats=[_beat()],
                    anchors=[_anchor()],
                    previous_shot=None,
                    next_beat=None,
                    allowed_chars=set(),
                    allowed_props=set(),
                    scene_id="scene-1",
                    episode_id="episode-1",
                )
        self.assertEqual(qwen.await_count, 2)
        self.assertEqual(captured.exception.metadata["repair_progress"], "rejected_no_progress")


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/stage04_v238_runtime.py tests/test_stage04_temporal_mode_enum_closure.py
          python -m unittest discover -s tests -p 'test_stage04_temporal_mode*.py' -v
          git diff --check

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py'

      - name: Record runtime hash and push fix
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNTIME_SHA256=$(sha256sum app/stage04_v238_runtime.py | awk '{print $1}')"
          git status --short
          git config user.name "ChatGPT Stage04 Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app/stage04_v238_runtime.py tests/test_stage04_temporal_mode_enum_closure.py
          git commit -m "fix(stage04): close temporal mode enum repair"
          git push origin HEAD:main
