name: Stage04 temporal mode hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage04-temporal-mode-hotfix.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare patch driver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tools/apply_stage04_temporal_mode_enum_fix.py")
          s = p.read_text(encoding="utf-8")
          needle = '        "targeted retry enum reminder",\n    )'
          pos = s.find(needle)
          if pos >= 0:
              start = s.rfind("    text = replace_once(\n", 0, pos)
              end = s.find("\n\n    text = replace_once(\n", pos)
              if start < 0 or end < 0:
                  raise SystemExit("could not isolate optional replacement")
              s = s[:start] + s[end + 2:]
              p.write_text(s, encoding="utf-8")
          PY

      - name: Apply Stage04 fix
        run: python tools/apply_stage04_temporal_mode_enum_fix.py

      - name: Refresh intentional runtime hash assertions
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          runtime = Path("app/stage04_v238_runtime.py")
          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          old = "46177fdd2947d9478ab3bedf31811fd6239c5fe13a11fe23ff6aad3be813188a"
          for path in [
              Path("tests/test_stage02_performance_optimization.py"),
              Path("tests/test_stage04_frontend_entry.py"),
          ]:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected old runtime hash not found in {path}")
              path.write_text(text.replace(old, digest), encoding="utf-8")
          print(f"RUNTIME_SHA256={digest}")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and Stage04 temporal tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/stage04_v238_runtime.py tests/test_stage04_temporal_mode_enum_closure.py
          python -m unittest discover -s tests -p 'test_stage04_temporal_mode*.py' -v
          git diff --check

      - name: Full test suite
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNTIME_SHA256=$(sha256sum app/stage04_v238_runtime.py | awk '{print $1}')"
          git config user.name "ChatGPT Stage04 Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app/stage04_v238_runtime.py \
            tests/test_stage04_temporal_mode_enum_closure.py \
            tests/test_stage02_performance_optimization.py \
            tests/test_stage04_frontend_entry.py
          git rm .github/workflows/stage04-temporal-mode-hotfix.yml
          git rm -f tools/apply_stage04_temporal_mode_enum_fix.py
          git commit -m "fix(stage04): close temporal mode enum repair"
          git push origin HEAD:main
